<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EDUFIN - Platform Manajemen Keuangan Pendidikan</title>
    <meta name="description" content="EDUFIN platform digital untuk manajemen SPP, cicilan, dan fundraising siswa." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ─── Security Headers (via meta) ──────────────────────── -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- ─── Preconnect — buka koneksi lebih awal ke server eksternal ── -->
    <!-- Kurangi latency DNS + TLS handshake pada request pertama       -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://pxqamlbdamrkwrdnbhmf.supabase.co" />
    <link rel="dns-prefetch" href="https://api.xendit.co" />

    <!-- ─── PWA Theme ────────────────────────────────────────── -->
    <meta name="theme-color" content="#0D5FD6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D5FD6" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ─── iOS PWA Support ──────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EDUFIN" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ─── Favicon ──────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- ─── Critical CSS inline — mencegah FOUC ─────────────── -->
    <style>
      html, body { height: 100%; margin: 0; background: #fff; }
      #root { height: 100%; }
      /* Hapus tap highlight di mobile */
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      /* Safe area notch iOS ditangani per komponen agar background header bisa tembus notch */
      /* Skeleton loader saat app pertama kali load */
      #root:empty::before {
        content: '';
        display: block;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #0D5FD6 0%, #108EE9 60%, #1AAEFC 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
